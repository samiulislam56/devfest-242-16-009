    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tender Document Package Builder - Transform, match, validate and generate correctly ordered submission-ready PDF packages for tender submissions." />
    <title>Tender Document Package Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme_preference') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (savedTheme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-text-primary antialiased min-h-screen selection:bg-accent/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
